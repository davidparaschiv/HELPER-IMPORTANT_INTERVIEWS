<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#ffffff">
  <title>Interview Study Cards</title>
  <style>
    :root {
      --background: #fffafa;
      --surface: rgba(255, 255, 255, 0.82);
      --surface-strong: rgba(255, 255, 255, 0.96);
      --red: #c62828;
      --red-dark: #8f1717;
      --red-soft: #fff1f1;
      --border: rgba(198, 40, 40, 0.46);
      --border-light: rgba(198, 40, 40, 0.20);
      --text: #241b1b;
      --muted: #786868;
      --shadow: 0 18px 50px rgba(125, 25, 25, 0.10);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at 10% 0%, rgba(198, 40, 40, 0.08), transparent 31%),
        radial-gradient(circle at 95% 15%, rgba(198, 40, 40, 0.05), transparent 28%),
        linear-gradient(180deg, #ffffff, var(--background));
    }

    button, input, textarea, select { font: inherit; }
    button { cursor: pointer; }

    .app {
      width: min(1040px, calc(100% - 28px));
      margin: 0 auto;
      padding: 24px 0 42px;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      margin-bottom: 20px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .logo {
      width: 46px;
      height: 46px;
      display: grid;
      place-items: center;
      border: 1px solid var(--red);
      border-radius: 14px;
      color: var(--red);
      background: rgba(255, 255, 255, 0.75);
      box-shadow: var(--shadow);
      font-weight: 900;
      letter-spacing: -0.04em;
      backdrop-filter: blur(14px);
    }

    h1, h2, h3, p { margin-top: 0; }
    h1 { margin-bottom: 2px; font-size: clamp(1.4rem, 4vw, 2rem); }
    .subtitle { margin: 0; color: var(--muted); font-size: 0.92rem; }

    .toolbar, .action-group {
      display: flex;
      flex-wrap: wrap;
      gap: 9px;
    }

    .toolbar { justify-content: flex-end; }

    .btn {
      border: 1px solid var(--red);
      border-radius: 12px;
      padding: 10px 14px;
      color: var(--red-dark);
      background: rgba(255, 255, 255, 0.76);
      box-shadow: 0 7px 20px rgba(125, 25, 25, 0.05);
      transition: transform 0.16s ease, background 0.16s ease, box-shadow 0.16s ease;
      backdrop-filter: blur(12px);
    }

    .btn:hover:not(:disabled) {
      transform: translateY(-1px);
      background: var(--red-soft);
      box-shadow: 0 10px 24px rgba(125, 25, 25, 0.10);
    }

    .btn:disabled { opacity: 0.36; cursor: not-allowed; }
    .btn.primary { color: #fff; background: var(--red); font-weight: 800; }
    .btn.primary:hover:not(:disabled) { background: var(--red-dark); }
    .btn.danger { color: var(--red-dark); background: #fff7f7; }
    .btn.compact { padding: 8px 11px; }

    .panel {
      border: 1px solid var(--border);
      border-radius: 22px;
      background: var(--surface);
      box-shadow: var(--shadow);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
    }

    .home-panel { padding: clamp(18px, 4vw, 30px); }

    .home-heading {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 18px;
    }

    .home-heading h2 { margin-bottom: 5px; }
    .home-heading p { margin-bottom: 0; color: var(--muted); }

    .subject-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
      gap: 14px;
    }

    .subject-card {
      min-height: 138px;
      padding: 18px;
      text-align: left;
      border: 1px solid var(--red);
      border-radius: 17px;
      color: var(--text);
      background: rgba(255, 255, 255, 0.72);
      box-shadow: 0 10px 30px rgba(125, 25, 25, 0.06);
      transition: transform 0.18s ease, background 0.18s ease, box-shadow 0.18s ease;
      backdrop-filter: blur(12px);
    }

    .subject-card:hover {
      transform: translateY(-3px);
      background: var(--red-soft);
      box-shadow: 0 16px 35px rgba(125, 25, 25, 0.12);
    }

    .subject-card h3 { margin-bottom: 9px; font-size: 1.08rem; color: var(--red-dark); }
    .subject-card p { margin-bottom: 0; color: var(--muted); font-size: 0.91rem; }
    .subject-count { color: var(--red); font-weight: 850; }

    .viewer { overflow: hidden; }

    .viewer-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 17px 20px;
      border-bottom: 1px solid var(--border-light);
      background: rgba(255, 255, 255, 0.55);
    }

    .badge {
      display: inline-flex;
      align-items: center;
      min-height: 31px;
      padding: 5px 11px;
      border: 1px solid var(--red);
      border-radius: 999px;
      color: var(--red-dark);
      background: var(--red-soft);
      font-size: 0.8rem;
      font-weight: 850;
    }

    .counter { color: var(--muted); font-size: 0.9rem; font-weight: 750; }

    .progress-track { height: 5px; background: #f5dfdf; }
    .progress-bar { height: 100%; width: 0; background: var(--red); transition: width 0.22s ease; }

    .card-content {
      min-height: 430px;
      display: grid;
      align-content: center;
      padding: clamp(26px, 6vw, 58px);
    }

    .question-row {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 14px;
      max-width: 920px;
      margin-bottom: 28px;
    }

    .card-content h2 {
      flex: 1;
      max-width: 880px;
      margin: 0;
      font-size: clamp(1.5rem, 4.8vw, 2.45rem);
      line-height: 1.16;
      color: #2e2020;
    }

    .question-edit-btn {
      flex: 0 0 auto;
      width: 42px;
      height: 42px;
      display: grid;
      place-items: center;
      padding: 0;
      border: 1px solid var(--red);
      border-radius: 12px;
      color: var(--red-dark);
      background: rgba(255, 255, 255, 0.82);
      box-shadow: 0 7px 18px rgba(125, 25, 25, 0.07);
      font-size: 1.05rem;
      line-height: 1;
      transition: transform 0.16s ease, background 0.16s ease;
    }

    .question-edit-btn:hover {
      transform: translateY(-1px);
      background: var(--red-soft);
    }

    .answer-block {
      padding: 22px;
      border: 1px solid var(--red);
      border-radius: 17px;
      background: rgba(255, 255, 255, 0.72);
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.9);
      backdrop-filter: blur(12px);
    }

    .label {
      display: block;
      margin-bottom: 9px;
      color: var(--red);
      font-size: 0.77rem;
      font-weight: 900;
      letter-spacing: 0.11em;
      text-transform: uppercase;
    }

    .answer-text {
      margin: 0;
      font-size: clamp(1rem, 2.5vw, 1.15rem);
      line-height: 1.72;
    }

    .answer-text p {
      margin: 0 0 16px;
    }

    .answer-text p:last-child {
      margin-bottom: 0;
    }

    .command-block {
      margin: 14px 0 18px;
      padding: 14px 16px;
      overflow-x: auto;
      border: 1px solid var(--red);
      border-radius: 12px;
      background: #fff7f7;
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.9);
    }

    .command-block code {
      display: block;
      color: #611313;
      font-family: Consolas, Monaco, "Courier New", monospace;
      font-size: 0.94rem;
      line-height: 1.55;
      white-space: pre;
    }

    .viewer-actions {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 12px;
      padding: 17px 20px;
      border-top: 1px solid var(--border-light);
      background: rgba(255, 255, 255, 0.50);
    }

    .empty { padding: 48px 18px; text-align: center; color: var(--muted); }
    .footer-note { margin: 18px 0 0; text-align: center; color: var(--muted); font-size: 0.82rem; }

    dialog {
      width: min(640px, calc(100% - 24px));
      padding: 0;
      border: 1px solid var(--red);
      border-radius: 20px;
      color: var(--text);
      background: rgba(255, 255, 255, 0.94);
      box-shadow: 0 30px 80px rgba(95, 15, 15, 0.22);
      backdrop-filter: blur(22px);
    }

    dialog::backdrop { background: rgba(70, 15, 15, 0.22); backdrop-filter: blur(5px); }

    .dialog-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 18px 20px;
      border-bottom: 1px solid var(--border-light);
    }

    .dialog-head h2 { margin: 0; font-size: 1.2rem; }
    .dialog-body { padding: 20px; }
    .form-grid { display: grid; gap: 15px; }
    .field { display: grid; gap: 7px; }
    .field label { color: var(--muted); font-size: 0.88rem; font-weight: 750; }

    input, textarea, select {
      width: 100%;
      padding: 11px 12px;
      border: 1px solid var(--border);
      border-radius: 11px;
      outline: none;
      color: var(--text);
      background: rgba(255, 255, 255, 0.88);
    }

    input:focus, textarea:focus, select:focus { border-color: var(--red-dark); box-shadow: 0 0 0 3px rgba(198,40,40,0.09); }
    textarea { min-height: 104px; resize: vertical; }

    .dialog-actions {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      padding: 0 20px 20px;
    }

    /* Mobile-first layout and horizontal-scroll protection */
    html, body {
      width: 100%;
      max-width: 100%;
      overflow-x: hidden;
    }

    body {
      position: relative;
    }

    .app {
      width: calc(100% - 18px);
      max-width: 1040px;
      padding: 14px 0 32px;
      overflow-x: clip;
    }

    .topbar {
      align-items: flex-start;
      flex-direction: column;
      gap: 14px;
    }

    .brand,
    .brand > div:last-child,
    .toolbar,
    .panel,
    .viewer,
    .card-content,
    .question-row,
    .answer-block,
    .answer-text,
    .viewer-actions,
    .action-group {
      min-width: 0;
      max-width: 100%;
    }

    .toolbar {
      width: 100%;
      justify-content: flex-start;
    }

    .toolbar .btn {
      flex: 1 1 calc(50% - 9px);
      min-width: 0;
    }

    .logo {
      width: 41px;
      height: 41px;
      flex: 0 0 auto;
    }

    .home-panel {
      padding: 16px;
    }

    .home-heading {
      align-items: flex-start;
      flex-direction: column;
    }

    .subject-grid {
      grid-template-columns: 1fr;
    }

    .subject-card {
      width: 100%;
      min-height: 112px;
    }

    .viewer-head,
    .viewer-actions {
      padding-left: 14px;
      padding-right: 14px;
    }

    .card-content {
      min-height: 465px;
      padding: 25px 18px;
    }

    .question-row {
      width: 100%;
      gap: 10px;
    }

    .card-content h2,
    .answer-text,
    .answer-text p {
      overflow-wrap: anywhere;
      word-break: break-word;
    }

    .answer-block {
      width: 100%;
      padding: 17px;
    }

    .command-block {
      width: 100%;
      max-width: 100%;
      overflow-x: auto;
      overscroll-behavior-x: contain;
      -webkit-overflow-scrolling: touch;
    }

    .command-block code {
      min-width: max-content;
    }

    .viewer-actions {
      align-items: stretch;
      flex-direction: column;
    }

    .viewer-actions > .action-group {
      width: 100%;
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
    }

    .viewer-actions > .action-group:last-child {
      grid-template-columns: repeat(2, minmax(0, 1fr));
    }

    .viewer-actions .btn {
      width: 100%;
      min-width: 0;
      padding-left: 8px;
      padding-right: 8px;
    }

    dialog {
      max-width: calc(100vw - 18px);
      max-height: calc(100dvh - 18px);
      overflow-x: hidden;
      overflow-y: auto;
    }

    .dialog-head,
    .dialog-body,
    .dialog-actions,
    .form-grid,
    .field,
    input,
    textarea,
    select {
      min-width: 0;
      max-width: 100%;
    }

    .dialog-actions {
      flex-wrap: wrap;
    }

    @media (min-width: 681px) {
      .app {
        width: min(1040px, calc(100% - 28px));
        padding: 24px 0 42px;
      }

      .topbar {
        align-items: center;
        flex-direction: row;
        gap: 18px;
      }

      .toolbar {
        width: auto;
        justify-content: flex-end;
      }

      .toolbar .btn {
        flex: 0 0 auto;
      }

      .logo {
        width: 46px;
        height: 46px;
      }

      .home-panel {
        padding: clamp(18px, 4vw, 30px);
      }

      .home-heading {
        align-items: end;
        flex-direction: row;
      }

      .subject-grid {
        grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
      }

      .subject-card {
        min-height: 138px;
      }

      .card-content {
        min-height: 430px;
        padding: clamp(26px, 6vw, 58px);
      }

      .answer-block {
        padding: 22px;
      }

      .viewer-actions {
        align-items: center;
        flex-direction: row;
      }

      .viewer-actions > .action-group,
      .viewer-actions > .action-group:last-child {
        width: auto;
        display: flex;
      }

      .viewer-actions .btn {
        width: auto;
        padding-left: 14px;
        padding-right: 14px;
      }
    }
  </style>
</head>
<body>
  <main class="app">
    <header class="topbar">
      <div class="brand">
        <div class="logo">IQ</div>
        <div>
          <h1>Interview Study Cards</h1>
          <p class="subtitle">Docker, Kubernetes, Helm, and AWS</p>
        </div>
      </div>
      <div class="toolbar">
        <button class="btn compact" id="homeTopBtn" type="button">Home</button>
        <button class="btn compact primary" id="addBtn" type="button">+ Add</button>
        <button class="btn compact" id="exportBtn" type="button">Export JSON</button>
        <button class="btn compact danger" id="resetBtn" type="button">Reload JSON</button>
      </div>
    </header>

    <section id="homeView" class="panel home-panel"></section>

    <section id="viewerView" class="panel viewer" hidden>
      <div class="viewer-head">
        <span class="badge" id="subjectBadge"></span>
        <span class="counter" id="counter"></span>
      </div>
      <div class="progress-track"><div class="progress-bar" id="progressBar"></div></div>
      <article class="card-content">
        <div class="question-row">
          <h2 id="questionText"></h2>
          <button class="question-edit-btn" id="questionEditBtn" type="button" aria-label="Edit this question" title="Edit this question">✎</button>
        </div>
        <div class="answer-block">
          <span class="label">Answer</span>
          <div class="answer-text" id="answerText"></div>
        </div>
      </article>
      <div class="viewer-actions">
        <div class="action-group">
          <button class="btn" id="previousBtn" type="button">Previous</button>
          <button class="btn" id="homeBtn" type="button">Home</button>
          <button class="btn primary" id="nextBtn" type="button">Next</button>
        </div>
        <div class="action-group">
          <button class="btn" id="editBtn" type="button">Edit</button>
          <button class="btn danger" id="deleteBtn" type="button">Remove</button>
        </div>
      </div>
    </section>

    <p class="footer-note">Cards load from questions.json each time. After editing, replace the JSON file with the downloaded version.</p>
  </main>

  <dialog id="itemDialog">
    <form id="itemForm">
      <div class="dialog-head">
        <h2 id="dialogTitle">Add card</h2>
        <button class="btn compact" type="button" id="closeDialogBtn">Close</button>
      </div>
      <div class="dialog-body">
        <div class="form-grid">
          <div class="field">
            <label for="subjectSelect">Subject</label>
            <select id="subjectSelect" required></select>
          </div>
          <div class="field" id="newSubjectField" hidden>
            <label for="newSubjectInput">New subject name</label>
            <input id="newSubjectInput" autocomplete="off" placeholder="Example: Terraform">
          </div>
          <div class="field">
            <label for="questionInput">Question or topic</label>
            <textarea id="questionInput" required placeholder="Enter the interview question or study topic."></textarea>
          </div>
          <div class="field">
            <label for="answerInput">Answer</label>
            <textarea id="answerInput" required placeholder="Enter a clear interview-ready answer."></textarea>
          </div>
        </div>
      </div>
      <div class="dialog-actions">
        <button class="btn" type="button" id="cancelBtn">Cancel</button>
        <button class="btn primary" type="submit">Save</button>
      </div>
    </form>
  </dialog>

  <script>
    const JSON_FILE = "questions.json";

    let items = [];
    let currentSubject = "";
    let currentPosition = 0;
    let editingIndex = null;

    const homeView = document.getElementById("homeView");
    const viewerView = document.getElementById("viewerView");
    const subjectBadge = document.getElementById("subjectBadge");
    const counter = document.getElementById("counter");
    const progressBar = document.getElementById("progressBar");
    const questionText = document.getElementById("questionText");
    const questionEditBtn = document.getElementById("questionEditBtn");
    const answerText = document.getElementById("answerText");
    const previousBtn = document.getElementById("previousBtn");
    const nextBtn = document.getElementById("nextBtn");
    const homeBtn = document.getElementById("homeBtn");
    const homeTopBtn = document.getElementById("homeTopBtn");
    const addBtn = document.getElementById("addBtn");
    const editBtn = document.getElementById("editBtn");
    const deleteBtn = document.getElementById("deleteBtn");
    const exportBtn = document.getElementById("exportBtn");
    const resetBtn = document.getElementById("resetBtn");

    const itemDialog = document.getElementById("itemDialog");
    const itemForm = document.getElementById("itemForm");
    const dialogTitle = document.getElementById("dialogTitle");
    const subjectSelect = document.getElementById("subjectSelect");
    const newSubjectField = document.getElementById("newSubjectField");
    const newSubjectInput = document.getElementById("newSubjectInput");
    const questionInput = document.getElementById("questionInput");
    const answerInput = document.getElementById("answerInput");
    const closeDialogBtn = document.getElementById("closeDialogBtn");
    const cancelBtn = document.getElementById("cancelBtn");

    function normalizeItem(item) {
      return {
        subject: String(item.subject || "General").trim() || "General",
        question: String(item.question || "Untitled topic").trim() || "Untitled topic",
        answer: String(item.answer || "").trim()
      };
    }

    async function loadJsonFile() {
      try {
        const response = await fetch(`${JSON_FILE}?v=${Date.now()}`, { cache: "no-store" });
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        const data = await response.json();
        if (!Array.isArray(data)) throw new Error("The JSON root must be an array.");
        items = data.map(normalizeItem);
        currentSubject = "";
        currentPosition = 0;
        renderHome();
      } catch (error) {
        console.error("Could not load questions.json:", error);
        viewerView.hidden = true;
        homeView.hidden = false;
        homeView.innerHTML = `
          <div class="empty">
            <h2>Could not load ${escapeHtml(JSON_FILE)}</h2>
            <p>Keep <strong>interview-study.html</strong> and <strong>${escapeHtml(JSON_FILE)}</strong> in the same folder and open them through a local or web server.</p>
            <p>Some mobile browsers block loading nearby files when HTML is opened directly with a file:// address.</p>
            <button class="btn primary" id="retryLoadBtn" type="button">Try again</button>
          </div>`;
        document.getElementById("retryLoadBtn").addEventListener("click", loadJsonFile);
      }
    }

    function getSubjects() {
      return [...new Set(items.map(item => item.subject))].sort((a, b) => a.localeCompare(b));
    }

    function getSubjectItems(subject) {
      return items
        .map((item, globalIndex) => ({ item, globalIndex }))
        .filter(entry => entry.item.subject === subject);
    }

    function renderHome() {
      viewerView.hidden = true;
      homeView.hidden = false;

      const subjects = getSubjects();
      if (!subjects.length) {
        homeView.innerHTML = '<div class="empty"><h2>No cards yet</h2><p>Use Add to create your first subject and study card.</p></div>';
        return;
      }

      homeView.innerHTML = `
        <div class="home-heading">
          <div>
            <h2>Choose a subject</h2>
            <p>Cards are loaded fresh from ${escapeHtml(JSON_FILE)} whenever the app opens.</p>
          </div>
        </div>
        <div class="subject-grid">
          ${subjects.map(subject => {
            const count = getSubjectItems(subject).length;
            return `
              <button class="subject-card" type="button" data-subject="${escapeHtml(subject)}">
                <h3>${escapeHtml(subject)}</h3>
                <p><span class="subject-count">${count}</span> ${count === 1 ? "card" : "cards"}</p>
              </button>`;
          }).join("")}
        </div>`;

      homeView.querySelectorAll("[data-subject]").forEach(button => {
        button.addEventListener("click", () => openSubject(button.dataset.subject));
      });
    }

    function openSubject(subject, requestedPosition = 0) {
      const subjectItems = getSubjectItems(subject);
      if (!subjectItems.length) {
        renderHome();
        return;
      }

      currentSubject = subject;
      currentPosition = Math.max(0, Math.min(requestedPosition, subjectItems.length - 1));
      renderViewer();
    }

    function renderViewer() {
      const subjectItems = getSubjectItems(currentSubject);
      if (!subjectItems.length) {
        renderHome();
        return;
      }

      currentPosition = Math.max(0, Math.min(currentPosition, subjectItems.length - 1));
      const current = subjectItems[currentPosition].item;

      homeView.hidden = true;
      viewerView.hidden = false;
      subjectBadge.textContent = current.subject;
      counter.textContent = `${currentPosition + 1} / ${subjectItems.length}`;
      progressBar.style.width = `${((currentPosition + 1) / subjectItems.length) * 100}%`;
      questionText.textContent = current.question;
      renderFormattedAnswer(current.answer);
      previousBtn.disabled = currentPosition === 0;
      nextBtn.disabled = currentPosition === subjectItems.length - 1;
    }

    function renderFormattedAnswer(answer) {
      answerText.replaceChildren();
      const source = String(answer || "").trim();
      if (!source) return;

      const commandPattern = /(?:'([^'\n]+)'|`([^`\n]+)`)/g;
      let lastIndex = 0;
      let match;

      function appendText(text) {
        const cleaned = text.trim();
        if (!cleaned) return;
        const paragraphs = cleaned
          .split(/\n\s*\n|(?<=[.!?])\s+(?=[A-Z0-9])/g)
          .map(part => part.trim())
          .filter(Boolean);
        paragraphs.forEach(paragraph => {
          const element = document.createElement("p");
          element.textContent = paragraph;
          answerText.appendChild(element);
        });
      }

      function appendCommand(command) {
        const pre = document.createElement("pre");
        pre.className = "command-block";
        const code = document.createElement("code");
        code.textContent = command.trim();
        pre.appendChild(code);
        answerText.appendChild(pre);
      }

      while ((match = commandPattern.exec(source)) !== null) {
        appendText(source.slice(lastIndex, match.index));
        appendCommand(match[1] || match[2]);
        lastIndex = commandPattern.lastIndex;
      }
      appendText(source.slice(lastIndex));
    }

    function currentEntry() {
      const subjectItems = getSubjectItems(currentSubject);
      return subjectItems[currentPosition] || null;
    }

    function fillSubjectOptions(selectedSubject = "") {
      const subjects = getSubjects();
      subjectSelect.innerHTML = [
        ...subjects.map(subject => `<option value="${escapeHtml(subject)}">${escapeHtml(subject)}</option>`),
        '<option value="__new__">Create new subject...</option>'
      ].join("");

      if (selectedSubject && subjects.includes(selectedSubject)) {
        subjectSelect.value = selectedSubject;
      } else if (subjects.length) {
        subjectSelect.value = subjects[0];
      } else {
        subjectSelect.value = "__new__";
      }
      toggleNewSubjectField();
    }

    function toggleNewSubjectField() {
      const creatingNew = subjectSelect.value === "__new__";
      newSubjectField.hidden = !creatingNew;
      newSubjectInput.required = creatingNew;
      if (!creatingNew) newSubjectInput.value = "";
    }

    function openAddDialog() {
      editingIndex = null;
      dialogTitle.textContent = "Add card";
      fillSubjectOptions(currentSubject);
      questionInput.value = "";
      answerInput.value = "";
      newSubjectInput.value = "";
      itemDialog.showModal();
    }

    function openEditDialog() {
      const entry = currentEntry();
      if (!entry) return;
      editingIndex = entry.globalIndex;
      dialogTitle.textContent = "Edit card";
      fillSubjectOptions(entry.item.subject);
      questionInput.value = entry.item.question;
      answerInput.value = entry.item.answer;
      newSubjectInput.value = "";
      itemDialog.showModal();
    }

    function closeDialog() {
      itemDialog.close();
      itemForm.reset();
      editingIndex = null;
    }

    async function saveJsonReplacement() {
      const jsonText = JSON.stringify(items, null, 2) + "\n";
      const shouldSave = confirm(`The cards changed. Save an updated ${JSON_FILE} now?`);
      if (!shouldSave) return;

      if ("showSaveFilePicker" in window) {
        try {
          const handle = await window.showSaveFilePicker({
            suggestedName: JSON_FILE,
            types: [{ description: "JSON file", accept: { "application/json": [".json"] } }]
          });
          const writable = await handle.createWritable();
          await writable.write(jsonText);
          await writable.close();
          return;
        } catch (error) {
          if (error && error.name === "AbortError") return;
          console.warn("Direct replacement failed; using download instead.", error);
        }
      }

      const blob = new Blob([jsonText], { type: "application/json" });
      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");
      link.href = url;
      link.download = JSON_FILE;
      document.body.appendChild(link);
      link.click();
      link.remove();
      setTimeout(() => URL.revokeObjectURL(url), 1000);
    }

    async function removeCurrent() {
      const entry = currentEntry();
      if (!entry) return;
      if (!confirm(`Remove this card from ${entry.item.subject}?`)) return;

      const oldSubject = entry.item.subject;
      items.splice(entry.globalIndex, 1);
      const remaining = getSubjectItems(oldSubject);
      if (!remaining.length) {
        currentSubject = "";
        currentPosition = 0;
        renderHome();
      } else {
        currentPosition = Math.min(currentPosition, remaining.length - 1);
        renderViewer();
      }
      await saveJsonReplacement();
    }

    function exportJson() {
      const blob = new Blob([JSON.stringify(items, null, 2) + "\n"], { type: "application/json" });
      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");
      link.href = url;
      link.download = JSON_FILE;
      document.body.appendChild(link);
      link.click();
      link.remove();
      setTimeout(() => URL.revokeObjectURL(url), 1000);
    }

    async function reloadData() {
      if (!confirm(`Discard unsaved in-memory changes and reload ${JSON_FILE}?`)) return;
      await loadJsonFile();
    }

    function escapeHtml(value) {
      return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    previousBtn.addEventListener("click", () => {
      if (currentPosition > 0) {
        currentPosition -= 1;
        renderViewer();
      }
    });

    nextBtn.addEventListener("click", () => {
      const length = getSubjectItems(currentSubject).length;
      if (currentPosition < length - 1) {
        currentPosition += 1;
        renderViewer();
      }
    });

    homeBtn.addEventListener("click", renderHome);
    homeTopBtn.addEventListener("click", renderHome);
    addBtn.addEventListener("click", openAddDialog);
    editBtn.addEventListener("click", openEditDialog);
    questionEditBtn.addEventListener("click", openEditDialog);
    deleteBtn.addEventListener("click", removeCurrent);
    exportBtn.addEventListener("click", exportJson);
    resetBtn.addEventListener("click", reloadData);
    closeDialogBtn.addEventListener("click", closeDialog);
    cancelBtn.addEventListener("click", closeDialog);
    subjectSelect.addEventListener("change", toggleNewSubjectField);

    itemForm.addEventListener("submit", async event => {
      event.preventDefault();

      const subject = subjectSelect.value === "__new__"
        ? newSubjectInput.value.trim()
        : subjectSelect.value.trim();
      const question = questionInput.value.trim();
      const answer = answerInput.value.trim();
      if (!subject || !question || !answer) return;

      if (editingIndex === null) {
        items.push({ subject, question, answer });
        currentSubject = subject;
        currentPosition = getSubjectItems(subject).length - 1;
      } else {
        items[editingIndex] = { subject, question, answer };
        currentSubject = subject;
        const subjectItems = getSubjectItems(subject);
        currentPosition = Math.max(0, subjectItems.findIndex(entry => entry.globalIndex === editingIndex));
      }

      itemDialog.close();
      editingIndex = null;
      renderViewer();
      await saveJsonReplacement();
    });

    itemDialog.addEventListener("click", event => {
      const rectangle = itemDialog.getBoundingClientRect();
      const outside = event.clientX < rectangle.left || event.clientX > rectangle.right || event.clientY < rectangle.top || event.clientY > rectangle.bottom;
      if (outside) closeDialog();
    });

    loadJsonFile();
  </script>
</body>
</html>
